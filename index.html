function cycCard(a){const c=cyc(a,TODAY);if(!c)return'';const days=[];for(let i=TODAY;i<=TOTAL;i++){const x=cyc(a,i);days.push(`<span class="chip" style="background:${x.k=='luteal'?'#c9a24b44':'var(--line)'}">${i==TOTAL?'W/I':(i-TOTAL)+'d'}: ${x.n}</span>`)}

function zone(a){const i=last(a);if(i<0||dl(TODAY)>7)return'green';const d=a.w[i]-ex(a,i);return d>S.t.red?'red':d>S.t.band?'amber':d<-1.5*S.t.band?'fast':'green'}
const SWD={light:.4,moderate:.7,hard:1,'very hard':1.3};
const trSess=(a,day)=>(a.tr&&a.tr[day])||[];
function trainH(a,day){return trSess(a,day).reduce((m,s)=>m+(+s.d||60),0)/60}

function alerts(){const o=[];S.a.forEach(a=>withT(a,()=>{const z=zone(a);if(z=='red'||z=='fast')o.push({k:'z'+a.id+z+last(a),a,t:a.name+(z=='red'?' is behind the planned pace':' is losing weight too fast')});const s=safety(a);if(s)o.push({k:'s'+a.id+last(a),a,t:a.name+': '+s});

const tdate=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const wdDate=a=>{const p=(a.wd||'').split('-');return p.length==3?new Date(+p[0],+p[1]-1,+p[2]):null};

let FD=0;const isod=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function chart(a){const x0=S.zoom=='full'?0:TOTAL-14,x1=TOTAL,W=760,H=300,L=44,Rr=16,T=14,B=44,ix=[];for(let i=x0;i<=x1;i++)ix.push(i);
const vals=ix.map(i=>ex(a,i)).concat(ix.filter(i=>a.w[i]!=null).map(i=>a.w[i])),lo=Math.min(a.target,...vals)-.8,hi=Math.max(...vals)+.8,X=i=>L+(i-x0)/(x1-x0)*(W-L-Rr),Y=w=>T+(hi-w)/(hi-lo)*(H-T-B);

ous or confused, eat and drink and tell your coach.": "אם יש סחרחורת, בחילה או בלבול, לאכול ולשתות ולדווח למאמן.", "Water taper today: drink to thirst. No target.": "הפחתת מים היום: לשתות לפי צמא. בלי יעד.", "After 18:00, sip to thirst only.": "אחרי 18:00, ללגום לפי צמא בלבד.", "Past your 18:00 cut-off.": "עברתם את שעת ה-18:00.", " It is recommended that you stop eating by 18:00 and drink to thirst today.": " מומלץ שתפסיקו לאכול עד 18:00 ותשתו לפי צמא היום.", " Water loading is on for you because you are behind the planned weight.": " העמסת נוזלים מופעלת עבורכם כי אתם מפגרים אחרי המשקל המתוכנן.", "Now: ": "כעת: ", "Earlier restrictions stay in place until weigh-in.": "ההגבלות הקודמות נשארות עד השקילה.", "Gradual descent, 0.5 to 1 kg/week. Keep protein and carbs up.": "ירידה הדרגתית, 0.5 עד 1 ק\"ג בשבוע. לשמור על חלבון ופחמימות.", "Fiber under 10 g/day for the 4 days before weigh-in.": "סיבים מתחת ל-10 גרם ליום ב-4 הימים שלפני השקילה.", "Lower sodium, only if needed.": "הפחתת נתרן, רק אם צריך.", "Carbs 2 to 3 g/kg for the 1 to 2 days before weigh-in.": "פחמימות 2 עד 3 גרם לק\"ג ביום או יומיים שלפני השקילה.", "Supervised sweat only, if still above target.": "הזעה בפיקוח בלבד, אם עדיין מעל היעד.", "Oral rehydration first, then refuel carbs.": "קודם תמיסת שתייה, אחר כך השלמת פחמימות.", "It is also recommended that the athlete": "מומלץ גם שהספורטאי", "Today's target": "היעד להיום", ". Calculated as 1.5 mL for each calorie in your plan": ". מחושב כ-1.5 מ\"ל לכל קלוריה בתוכנית שלכם", ", plus 25% for water loading": ", ועוד 25% להעמסת נוזלים", ". Water loading is off for you today (luteal phase)": ". העמסת נוזלים כבויה עבורכם היום (שלב לוטאלי)", "Your window between weigh-in and fight: ": "החלון בין השקילה לקרב: ", "under 4 hours": "מתחת ל-4 שעות", "4 to 12 hours": "4 עד 12 שעות", "12 to 24 hours": "12 עד 24 שעות", "24 to 36 hours": "24 עד 36 שעות", "Right after weigh-in: oral rehydration solution, 1 to 1.5 L per hour, with 1.2 to 2.1 g sodium per liter.": "מיד אחרי השקילה: const HEX3={"Basis: ISSN position stand": "בסיס: מסמך עמדה של ISSN", "Open paper": "פתיחת המאמר", "Before the cut: eat and train as usual. Carbs at least 3 g/kg, protein 1.6 to 2.2 g/kg, fat at least 0.5 g/kg. The app is for the weight cut itself, not for losing weight before it.": "לפני החיתוך: לאכול ולהתאמן כרגיל. פחמימות לפחות 3 גרם לק\"ג, חלבון 1.6 עד 2.2 גרם לק\"ג, שומן לפחות 0.5 גרם לק\"ג. האפליקציה מיועדת לחיתוך המשקל עצמו, לא לירידה במשקל לפניו.", "Fiber under 10 g/day for 4+ days: 1 to 2% body mass. Glycogen depletion (carbs 2 to 3 g/kg, under 50 g on the last day): 1 to 2%.": "סיבים מתחת ל-10 גרם ליום במשך 4 ימים ויותר: 1 עד 2% ממשקל הגוף. דלדול גליקוגן (פחמימות 2 עד 3 גרם לק\"ג, פחות מ-50 גרם ביום האחרון): 1 עד 2%.", "Sodium under 2.3 g/day, not far below. Water loading only with care (hyponatremia).": "נתרן מתחת ל-2.3 גרם ביום, בלי לרדת הרבה מתחת. העמסת נוזלים רק בזהירות (היפונתרמיה).", "Sauna and sweating: about 2 to 4% within 24 h, supervised.": "סאונה והזעה: כ-2 עד 4% תוך 24 שעות, בפיקוח.", "Maximum remaining loss: 6.7% at 72 h, 5.7% at 48 h, 4.4% at 24 h.": "מקסימום ירידה שנותרה: 6.7% ב-72 שעות, 5.7% ב-48 שעות, 4.4% ב-24 שעות.", "The time between weigh-in and fight changes the plan. Net sweat loss allowed: under 4 h 0 to 3%, 4 to 12 h 2 to 4%, 12 to 24 h 3 to 5%, 24 to 36 h 4 to 6% of body mass. With under 4 hours there is little time to recover, so the app does not use sauna, water loading or a meal stop.": "הזמן בין השקילה לקרב משנה את התוכנית. ירידה נטו מותרת בהזעה: מתחת ל-4 שעות 0 עד 3%, 4 עד 12 שעות 2 עד 4%, 12 עד 24 שעות 3 עד 5%, 24 עד 36 שעות 4 עד 6% ממשקל הגוף. עם פחות מ-4 שעות יש מעט זמן להתאושש, ולכן האפליקציה לא משתמשת בסאונה, בהעמסת נוזלים או בעצירת ארוחה.", "Last week: no calorie deficit. Weight comes off through the stages above, not by eating less. An early meal stop (last meal 18:00 the day before weigh-in) is used only for athletes still above target. Fluid restriction is not endorsed, so only sipping to thirst is advised.": "השבוע האחרון: בלי גירעון קלורי. המשקל יורד דרך השלבים שלמעלה ולא דרך אכילה מופחתת. עצירת ארוחה מוקדמת (ארוחה אחרונה ב-18:00 ביום שלפני השקילה) משמשת רק ספורטאים שעדיין מעל היעד. הגבלת נוזלים אינה מומלצת, ולכן מומלץ רק ללגום לפי צמא.", "App schedule: fiber for the 4 days before weigh-in, carbs for the last 1 to 2 days. Sodium reduction, water loading, meal stop and sweat or sauna are added only if needed and only for adults. Under 18: fiber and carbs, and cutting back on salt (not below 1.5 g sodium a day) only as a last resort if behind the plan. No water changes, meal stop or sauna. The paper gives no day count for carbs, so the app follows your dietitian's setting.": "לוח האפליקציה: סיבים ב-4 הימים שלפני השקילה, פחמימות ביום או יומיים האחרונים. הפחתת נתרן, העמסת נוזלים, עצירת ארוחה והזעה או סאונה מתווספים רק אם צריך ורק לבוגרים. מתחת לגיל 18: סיבים ופחמימות, והפחתת מלח (לא מתחת ל-1.5 גרם נתרן ביום) רק כמוצא אחרון אם מפגרים אחרי התוכנית. בלי שינויים במים, עצירת ארוחה או סאונה. המאמר לא מציין כמה ימים לפחמימות, ולכן האפליקציה פועלת לפי ההגדרה של התזונאית.", "Water loading is not a default. The app switches it on only 2 to 3 days before weigh-in when an adult athlete is behind the planned weight (an app rule, the paper gives no threshold).": "העמסת נוזלים אינה ברירת מחדל. האפליקציה מפעילה אותה רק 2 עד 3 ימים לפני השקילה כשספורטאי בוגר מפגר אחרי המשקל המתוכנן (כלל של האפליקציה, המאמר לא מגדיר סף).", "Not endorsed: diuretics, laxatives, fasting, fluid restriction. Long-term effects of repeated cuts are unknown.": "לא מומלץ: משתנים, משלשלים, צום, הגבלת נוזלים. ההשפעות לטווח ארוך של חיתוכים חוזרים אינן ידועות.", "Dashed grey: planned. Black: actual. Green band: on pace. Red area: off pace. Axis: days to weigh-in.": "אפור מקווקו: מתוכנן. שחור: בפועל. פס ירוק: בקצב. אזור אדום: מחוץ לקצב. ציר: ימים לשקילה.", "Target ": "יעד ", " is behind the planned pace": " מפגר/ת אחרי הקצב המתוכנן", " is losing weight too fast": " יורד/ת במשקל מהר מדי", ": a fluid safety flag was raised. Check ['Type the food name. For packaged food, add the company name. For dairy, add the fat % (for example 5%). For meat, no fat % is needed. Enter how much you ate, and choose cooked or raw as you weighed it. For cooked rice, pasta or potatoes, do not add oil. We use standard cooked values.','כתבו את שם המזון. במוצר ארוז הוסיפו את שם החברה. במוצרי חלב הוסיפו אחוז שומן (למשל 5%). בבשר אין צורך באחוז שומן. הזינו כמה אכלתם ובחרו מבושל או גולמי כפי ששקלתם. באורז, פסטה או תפוחי אדמה מבושלים אין להוסיף שמן, אנחנו משתמשים בערכי מבושל סטנדרטיים.','اكتب اسم الطعام. للمنتجات المعبأة أضف اسم الشركة. لمنتجات الألبان أضف نسبة الدهون (مثلاً 5%). اللحوم لا تحتاج نسبة دهون. أدخل الكمية التي أكلتها واختر مطبوخ أو نيء كما وزنته. للأرز والمعكرونة والبطاطا المطبوخة لا تضف زيتاً، نستخدم قيماً قياسية للمطبوخ.','Введите название. Для упакованных продуктов добавьте компанию. Для молочных добавьте жирность (например 5%). Для мяса жирность не нужна. Укажите, сколько вы съели, и выберите «приготовленный» или «сырой» так, как взвешивали. Для варёного риса, пасты и картофеля масло не добавляйте: мы используем стандартные значения.','Escribe el nombre. En productos envasados añade la empresa. En lácteos añade el % de grasa (por ejemplo 5%). En carne no hace falta. Indica cuánto comiste y elige cocinado o crudo como lo pesaste. En arroz, pasta o patata cocidos no añadas aceite: usamos valores estándar.'],

['Kidney disease','מחלת כליות','مرض الكلى','Болезнь почек','Enfermedad renal'],['Heart condition','מחלת לב','مرض القلب','Болезнь сердца','Problema cardíaco'],['High blood pressure','לחץ דם גבוה','ارتفاع ضغط الدم','Высокое давление','Presión alta'],['Diabetes','סוכרת','السكري','Диабет','Diabetes'],['Other chronic condition','מחלה כרונית אחרת','حالة مزمنة أخرى','Другое хроническое заболевание','Otra enfermedad crónica'],['Diuretics (water pills)','משתנים (כדורי מים)','مدرات البول (حبوب الماء)','Диуретики (мочегонные)','Diuréticos (pastillas de agua)'],['Laxatives','משלשלים','ملينات','Слабительные','Laxantes'],['Other regular medication','תרופה קבועה אחרת','دواء منتظم آخر','Другие постоянные лекарства','Otra medicación habitual'],['Eating disorder, current or past','הפרעת אכילה, בהווה או בעבר','اضطراب أكل، حالي أو سابق','Расстройство пищевого поведения, сейчас или в прошлом','Trastorno alimentario, actual o pasado'],['Fainting during a previous cut','התעלפות בחיתוך קודם','إغماء أثناء تخفيف وزن سابق','Обморок при прошлом сгонке веса','Desmayo en un corte anterior'],['Heat illness or hospital visit after a cut','מחלת חום או ביקור בבית חולים אחרי חיתוך','ضربة حرارة أو زيارة مستشفى بعد تخفيف الوزن','Тепловой удар или госпитализация после сгонки','Golpe de calor o ingreso tras un corte'],['Pregnant or possibly pregnant','בהיריון או ייתכן שבהיריון','حامل أو ربما حامل','Беременна или возможно беременна','Embarazada o posiblemente embarazada'],
['Welcome to Cutline','ברוכים הבאים ל-Cutline','مرحباً بك في Cutline','Добро пожаловать в Cutline','Bienvenido a Cutline'],['Before you start, please read this and tell us your age.','לפני שמתחילים, קראו את זה וכתבו את גילכם.','قبل أن تبدأ، اقرأ هذا وأخبرنا بعمرك.','Прежде чем начать, прочитайте это и укажите возраст.','Antes de empezar, lee esto e indica tu edad.'],['Your age','הגיל שלכם','عمرك','Ваш возраст','Tu edad'],['Under 18: a parent or guardian must agree','מתחת לגיל 18: נדרשת הסכמת הורה או אפוטרופוס','تحت 18 عاماً: يلزم موافقة أحد الوالدين أو الوصي','Младше 18: нужно согласие родителя или опекуна','Menores de 18: debe aceptar un padre o tutor'],['Parent or guardian full name','שם מלא של ההורה או האפוטרופוס','الاسم الكامل للوالد أو الوصي','Полное имя родителя или опекуна','Nombre completo del padre o tutor'],

['What we collect.','מה אנחנו אוספים.','ما الذي نجمعه.','Что мы собираем.','Qué recopilamos.'],['Your age, sex, weight, competition weight, and optionally your body fat % and menstrual cycle details. Also your food and water logs, daily check-ins and the health answers you give. This is health data.','גיל, מין, משקל, משקל תחרות, ובאופן אופציונלי אחוז שומן ופרטי מחזור. וכן רישומי אוכל ושתייה, צ\'ק-אין יומי ותשובות הבריאות שתמסרו. זה מידע בריאותי.','عمرك وجنسك ووزنك ووزن المنافسة، واختيارياً نسبة الدهون وتفاصيل الدورة الشهرية. وكذلك سجلات الطعام والماء والفحوص اليومية وإجاباتك الصحية. هذه بيانات صحية.','Возраст, пол, вес, соревновательный вес и, по желанию, процент жира и данные о цикле. А также записи о еде и воде, ежедневные проверки и ваши ответы о здоровье. Это данные о здоровье.','Tu edad, sexo, peso, peso de competición y, opcionalmente, % de grasa y datos del ciclo. También tus registros de comida y agua, controles diarios y respuestas de salud. Son datos de salud.'],
['Who sees it.','מי רואה את זה.','من يراها.','Кто это видит.','Quién lo ve.'],['Your coach sees your weight progress, your current stage, the guidance they send you and safety alerts. Your coach does not see what you eat or drink, your cycle, body fat or health answers.','המאמן רואה את התקדמות המשקל, את השלב הנוכחי, את ההנחיות ששלח לכם ואת התראות הבטיחות. המאמן לא רואה מה אתם אוכלים או שותים, את המחזור, את אחוז השומן או את התשובות הבריאותיות.','يرى مدربك تقدم وزنك ومرحلتك الحالية والتعليمات التي يرسلها وتنبيهات السلامة. لا يرى ما تأكله أو تشربه أو دورتك أو نسبة الدهون أو إجاباتك الصحية.','Тренер видит прогресс веса, текущий этап, отправленные вам рекомендации и сигналы безопасности. Тренер не видит, что вы едите и пьёте, ваш цикл, процент жира и ответы о здоровье.','Tu entrenador ve tu progreso de peso, tu etapa actual, las indicaciones que te envía y las alertas de seguridad. No ve lo que comes o bebes, tu ciclo, % de grasa ni tus respuestas de salud.'],
['Why.','למה.','لماذا.','Зачем.','Para qué.'],['To track your weight cut and warn you about risk. We do not use it for advertising and we do not sell it.','כדי לעקוב אחר חיתוך המשקל ולהזהיר אתכם מסיכון. איננו משתמשים בו לפרסום ואיננו מוכרים אותו.','لمتابعة تخفيف وزنك وتحذيرك من المخاطر. لا نستخدمها للإعلانات ولا نبيعها.','Чтобы отслеживать сгонку веса и предупреждать о рисках. Мы не используем это для рекламы и не продаём.','Para seguir tu corte de peso y avisarte de riesgos. No lo usamos para publicidad ni lo vendemos.'],
['Where it is stored.','איפה זה נשמר.','أين تُحفظ.','Где хранится.','Dónde se guarda.'],['In this demo version, only in your browser on this device.','בגרסת ההדגמה הזו, רק בדפדפן שלכם במכשיר הזה.','في هذه النسخة التجريبية، فقط في متصفحك على هذا الجهاز.','В этой демо-версии только в вашем браузере на этом устройстве.','En esta versión de demostración, solo en tu navegador en este dispositivo.'],
['Your choices.','הבחירות שלכם.','خياراتك.','Ваш выбор.','Tus opciones.'],['You can edit your details any time in Personal details, and delete all your data with "Delete my data". Deleting also withdraws your consent.','אפשר לערוך את הפרטים בכל עת ב"פרטים אישיים" ולמחוק את כל הנתונים באמצעות "מחיקת הנתונים שלי". מחיקה גם מבטלת את ההסכמה.','يمكنك تعديل بياناتك في أي وقت من «البيانات الشخصية» وحذف كل بياناتك عبر «حذف بياناتي». الحذف يسحب موافقتك أيضاً.','Вы можете изменить данные в «Личных данных» и удалить все данные кнопкой «Удалить мои данные». Удаление отзывает и согласие.','Puedes editar tus datos en «Datos personales» y borrar todo con «Eliminar mis datos». Borrar también retira tu consentimiento.'],
['Under 18.','מתחת לגיל 18.','تحت 18 عاماً.','Младше 18.','Menores de 18.'],['A parent or legal guardian must agree before you use Cutline. Weight cutting under 18 is not recommended.','הורה או אפוטרופוס חוקי חייב להסכים לפני השימוש ב-Cutline. חיתוך משקל מתחת לגיל 18 אינו מומלץ.','يجب أن يوافق أحد الوالدين أو الوصي القانوني قبل استخدام Cutline. لا يُوصى بتخفيف الوزن تحت 18 عاماً.','Родитель или законный опекун должен согласиться до использования Cutline. Сгонка веса до 18 лет не рекомендуется.','Un padre o tutor legal debe aceptar antes de usar Cutline. No se recomienda cortar peso siendo menor de 18.'],
['Not clinical advice.','לא המלצה קלינית.','ليست نصيحة سريرية.','Не клиническая рекомендация.','No es consejo clínico.'],['Cutline is a tracking tool. It gives general information based on a sports nutrition position stand. It is not a clinical recommendation or medical advice and does not replace a doctor or sports dietitian.','Cutline הוא כלי מעקב. הוא נותן מידע כללי המבוסס על מסמך עמדה בתזונת ספורט. זו אינה המלצה קלינית או ייעוץ רפואי, והיא אינה מחליפה רופא או תזונאי ספורט.','Cutline أداة متابعة. يقدم معلومات عامة مبنية على بيان موقف في التغذية الرياضية. ليس توصية سريرية ولا نصيحة طبية ولا يغني عن الطبيب أو أخصائي التغذية الرياضية.','Cutline — инструмент учёта. Он даёт общую информацию на основе позиции по спортивному питанию. Это не клиническая рекомендация и не медицинский совет, он не заменяет врача или диетолога.','Cutline es una herramienta de seguimiento. Da información general basada en una declaración de posición de nutrición deportiva. No es una recomendación clínica ni consejo médico y no sustituye a un médico o dietista deportivo.'],
['I have read the privacy notice and I agree that Cutline processes my health data as described.','קראתי את הודעת הפרטיות ואני מסכים/ה ש-Cutline יעבד את המידע הבריאותי שלי כמתואר.','قرأت إشعار الخصوصية وأوافق على أن يعالج Cutline بياناتي الصحية كما هو موضح.','Я прочитал(а) уведомление и согласен(на), что Cutline обрабатывает мои данные о здоровье, как описано.','He leído el aviso de privacidad y acepto que Cutline procese mis datos de salud como se describe.'],
['I understand Cutline is a tracking tool. It is not a clinical recommendation or medical advice and does not replace a doctor or sports dietitian.','אני מבין/ה ש-Cutline הוא כלי מעקב. זו אינה המלצה קלינית או ייעוץ רפואי, והוא אינו מחליף רופא או תזונאי ספורט.','أفهم أن Cutline أداة متابعة. ليس توصية سريرية ولا نصيحة طبية ولا يغني عن الطبيب أو أخصائي التغذية الرياضية.','Я понимаю, что Cutline — инструмент учёта. Это не клиническая рекомендация и не медицинский совет, он не заменяет врача или диетолога.','Entiendo que Cutline es una herramienta de seguimiento. No es una recomendación clínica ni consejo médico y no sustituye a un médico o dietista deportivo.'],
['I am this athlete\'s parent or legal guardian. I have read the privacy notice and I agree that the athlete may use Cutline and that their data is processed as described. I understand that weight cutting under 18 is not recommended and should only happen under the supervision of a doctor or sports dietitian.','אני ההורה או האפוטרופוס החוקי של הספורטאי/ת. קראתי את הודעת הפרטיות ואני מסכים/ה שהספורטאי/ת ישתמש/תשתמש ב-Cutline ושהנתונים יעובדו כמתואר. אני מבין/ה שחיתוך משקל מתחת לגיל 18 אינו מומלץ ויש לבצעו רק בפיקוח רופא או תזונאי ספורט.','أنا والد/وصي هذا الرياضي. قرأت إشعار الخصوصية وأوافق على استخدامه Cutline ومعالجة بياناته كما هو موضح. أفهم أن تخفيف الوزن تحت 18 عاماً غير مُوصى به ويجب أن يتم فقط تحت إشراف طبيب أو أخصائي تغذية رياضية.','Я родитель или законный опекун этого спортсмена. Я прочитал(а) уведомление и согласен(на), что он может пользоваться Cutline, а его данные обрабатываются, как описано. Я понимаю, что сгонка веса до 18 лет не рекомендуется и возможна только под наблюдением врача или диетолога.','Soy el padre o tutor legal de este atleta. He leído el aviso de privacidad y acepto que use Cutline y que sus datos se traten como se describe. Entiendo que no se recomienda cortar peso siendo menor de 18 y que solo debe hacerse bajo supervisión de un médico o dietista deportivo.'],
['Photos of labels.','תמונות של תוויות.','صور الملصقات.','Фото этикеток.','Fotos de etiquetas.'],['A label photo is read only to fill in the values. It is not saved in the app. With the optional server scan it is sent once to an AI service for reading.','תמונת תווית נקראת רק כדי למלא את הערכים. היא לא נשמרת באפליקציה. בסריקה האופציונלית דרך שרת היא נשלחת פעם אחת לשירות בינה מלאכותית לצורך קריאה.','تُقرأ صورة الملصق فقط لملء القيم ولا تُحفظ في التطبيق. مع المسح الاختياري عبر الخادم تُرسل مرة واحدة إلى خدمة ذكاء اصطناعي للقراءة.','Фото этикетки используется только для заполнения значений и не сохраняется в приложении. При необязательном сканировании через сервер оно один раз отправляется в сервис ИИ для распознавания.','La foto de la etiqueta solo se lee para rellenar los valores y no se guarda en la app. Con el escaneo opcional por servidor se envía una vez a un servicio de IA para leerla.'],
['Scan a label (photo)','סריקת תווית (צילום)','مسح ملصق (صورة)','Сканировать этикетку (фото)','Escanear etiqueta (foto)'],['Please check every number against the label before using.','בדקו כל מספר מול התווית לפני השימוש.','تحقق من كل رقم مقابل الملصق قبل الاستخدام.','Перед использованием сверьте каждое число с этикеткой.','Comprueba cada número con la etiqueta antes de usarlo.'],['Reading the label...','קוראים את התווית...','جارٍ قراءة الملصق...','Читаем этикетку...','Leyendo la etiqueta...'],

// ===== Weekly review =====
function rvS(){if(!S.rv)S.rv={we:isod(tdate()),age:15,kg:'',d:{}};return S.rv}
let RVR=null;
const RVD=(iso,n)=>{const p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]+n)};
const RVM=[['bk','Breakfast'],['s1','Snack 1'],['ln','Lunch'],['s2','Snack 2'],['dn','Dinner'],['nt','Night']];
function rvDays(){const r=rvS();return[6,5,4,3,2,1,0].map(k=>{const dt=RVD(r.we,-k);return{k,iso:isod(dt),dt}})}
function rvDD(iso){const r=rvS();return r.d[iso]=r.d[iso]||{}}
function rvSet(f,v){const r=rvS();r[f]=f=='age'?(+v||15):v;RVR=null;sv();R()}
function rvIn(iso,f,v){rvDD(iso)[f]=v;sv()}
function rvWeights(){const r=rvS();let last=+r.kg||null;const o={};rvDays().forEach(x=>{const w=+(rvDD(x.iso).w);if(w>20&&w<200)last=w;o[x.iso]=last});return o}
const rvAll=res=>res?[].concat(...Object.keys(res).map(k=>res[k])):[];
function rvCalc(){const r=rvS();RVR={};rvDays().forEach(x=>{const dd=rvDD(x.iso);RVR[x.iso]={};RVM.forEach(m=>{const t=(dd[m[0]]||'').trim();RVR[x.iso][m[0]]=t?parseMeal(t):[]})});R();const cur=RVR,jobs=[];Object.keys(cur).forEach(k=>Object.keys(cur[k]).forEach(m=>jobs.push(srvFill(cur[k][m]))));Promise.all(jobs).then(a=>{if(a.some(Boolean)&&RVR===cur)R()})}
function rvG(iso,m,i,v){RVR[iso][m][i].g=+v||0;R()}
function rvDel(iso,m,i){RVR[iso][m].splice(i,1);R()}
function rvAddTr(iso){const g=id=>document.getElementById('rt_'+iso+'_'+id),ty=(g('ty').value||'').trim();if(!ty){alert('Write the training type.');return}const dd=rvDD(iso);dd.tr=dd.tr||[];dd.tr.push({ty,int:g('int').value,t:g('t').value,d:+g('d').value||60,sw:+g('sw').value||0});sv();R()}
function rvDelTr(iso,k){rvDD(iso).tr.splice(k,1);sv();R()}
const rvSweat=ss=>Math.round((ss||[]).reduce((m,s)=>m+(s.sw>0?+s.sw:(SWD[s.int]||.7))*(+s.d||60)/60,0)*1000);
const rvWml=dd=>Math.round((+dd.wv||0)*(dd.wu=='cups'?200:dd.wu=='l'?1000:1));
function rvTargets(kg,d,minor){const fl=d<=(minor?3:4);const lo=d<=2?2*kg:3*kg,hi=d<=2?((minor||d>1)?3*kg:50):null;return{p:Math.round(1.6*kg),f:Math.round(.5*kg),lo:Math.round(lo),hi:hi==null?null:Math.round(hi),fib:fl?10:null,na:2300}}
function rvSum(items){const t={p:0,c:0,f:0,fib:0,na:0};(items||[]).forEach(o=>{if(o.miss)return;const k=o.g/100;for(const n in t)t[n]+=(o.x.per[n]||0)*k});return t}
function rvAmt(x,g,u){g=Math.max(5,Math.round(g/5)*5);let s=g+' g';const w=(UN[baseName(x.name)]||{})[u];if(w){let n=g/w;n=u=='piece'?Math.max(.5,Math.round(n*2)/2):Math.max(1,Math.round(n));s+=' (≈ '+qd(n,ULAB(x)[u])+')'}return baseName(x.name)+' '+s}
function rvEx(rem){const F=rvFoods(),o=[];
if(rem.p>=5&&F.chk&&F.cot){const cg=rem.p/(F.cot.per.p/100);o.push(['Protein','e.g. '+rvAmt(F.chk,rem.p/(F.chk.per.p/100),'piece')+(cg<=400?' or '+rvAmt(F.cot,cg,'tbsp'):'')])}
if(rem.c>=8&&F.rice&&F.bread)o.push(['Carbs','e.g. '+rvAmt(F.rice,rem.c/(F.rice.per.c/100),'tbsp')+' or '+rvAmt(F.bread,rem.c/(F.bread.per.c/100),'slice')]);
if(rem.f>=3&&F.oil)o.push(['Fat','e.g. '+rvAmt(F.oil,rem.f/(F.oil.per.f/100),'tsp')]);return o}
let RVF=null;function rvFoods(){if(!RVF)RVF={chk:localFind('chicken breast','cooked')[0],cot:localFind('cottage cheese 5%','as is')[0],rice:localFind('white rice','cooked')[0],bread:localFind('white bread','as is')[0],oil:localFind('olive oil','as is')[0]};return RVF}
function rvStage(d,minor){const U='Eat as usual: regular, balanced meals, with carbs at each meal and around training. Do not skip meals.',P='Cut back on ultra-processed food (packaged snacks, sweets, fast food, ready meals, soft drinks, processed meat). Eat home-cooked food, not food bought outside.',Fb='Choose low-fiber foods: white rice, white pasta, white bread, eggs, chicken, fish, lean meat and peeled, cooked potato. Avoid whole grains, oats, beans and lentils, nuts, seeds, raw vegetables, fruit skins and bran.',C='Eat slightly smaller portions of carbs than usual, for example less rice, pasta or bread. Keep some carbs around training.';
const b=[];if(d>=5||(d==4&&minor))b.push(U);if(d<=4)b.push(P);if(d<=(minor?3:4))b.push(Fb);if(d<=2)b.push(C);return b}
const rvN=v=>Math.round(v);
function rvDayHtml(x,w,res,dd){const r=rvS(),minor=r.age<18,k=x.k,tg=w?rvTargets(w,k,minor):null,st=rvStage(k,minor),items=rvAll(res);
let h=`<div style="margin:10px 0 8px;line-height:1.5"><b>Recommended for this day</b>${st.map(s=>`<div>• ${s}</div>`).join('')}</div>`;
if(!tg)return h+`<div class="mut" style="color:var(--r)">Enter a weight for this day or a body weight above, to get the targets.</div>`;
const has=items.length>0,t=has?rvSum(items):{p:0,c:0,f:0,fib:0,na:0};
const left=(v,tg2)=>tg2-v>0.5?`${rvN(tg2-v)} g left`:'Reached';
const rows=[['Protein',t.p,'at least '+tg.p+' g',left(t.p,tg.p)],['Carbs',t.c,tg.hi?tg.lo+' to '+tg.hi+' g':'at least '+tg.lo+' g',tg.hi&&t.c>tg.hi+.5?`over by ${rvN(t.c-tg.hi)} g`:left(t.c,tg.lo)],['Fat',t.f,'at least '+tg.f+' g',left(t.f,tg.f)],['Fiber',t.fib,tg.fib?'up to '+tg.fib+' g':'no limit',tg.fib?(t.fib>tg.fib?`over by ${rvN(t.fib-tg.fib)} g`:`${rvN(tg.fib-t.fib)} g left`):'-']];
h+=`<div style="display:grid;grid-template-columns:1.1fr 1fr 1.5fr 1.3fr;gap:4px 8px;font-size:13px;align-items:center"><span></span><span class="mut">Eaten</span><span class="mut">Target</span><span class="mut">Left to complete</span>${rows.map(o=>`<b>${o[0]}</b><span>${has?rvN(o[1])+' g':'-'}</span><span>${o[2]}</span><span${/over by/.test(o[3])?' style="color:var(--r)"':''}>${has?o[3]:'-'}</span>`).join('')}</div>`;
const over=has&&t.na>tg.na;h+=`<div style="margin-top:8px"><b>Sodium</b> <span>${has?rvN(t.na)+' mg':'-'}</span> · <span>up to ${tg.na} mg</span>${has?(over?`<div style="color:var(--r)">Over the sodium recommendation by ${rvN(t.na-tg.na)} mg</div>`:`<div class="mut">Sodium is within the recommendation</div>`):''}</div>`;
const sw=rvSweat(dd.tr),base=Math.round(30*w),tgt=base+sw,dr=rvWml(dd);
h+=`<div style="margin-top:8px"><b>Water</b> <span>${(dr/1000).toFixed(1)} L</span> · <span>target ${(tgt/1000).toFixed(1)} L</span> <span class="mut">(30 ml per kg${sw?' + '+(sw/1000).toFixed(1)+' L sweat':''})</span>${dr?(dr>=tgt?'':`<div class="mut">${((tgt-dr)/1000).toFixed(1)} L left</div>`):''}</div>`;
const rem=has?{p:Math.max(0,tg.p-t.p),c:Math.max(0,tg.lo-t.c),f:Math.max(0,tg.f-t.f)}:{p:tg.p,c:tg.lo,f:tg.f},ex=rvEx(rem);
if(ex.length)h+=`<div style="margin-top:10px"><b>${has?'Examples to complete the day':'Examples for the full day'}</b>${ex.map(o=>`<div class="mut"><b>${o[0]}</b> ${o[1]}</div>`).join('')}${tg.fib?'<div class="mut">Low-fiber foods only.</div>':''}</div>`;
return h}
const TTYPES=()=>S.lang=='he'?['כוח','מואי טאי','אגרוף','ספארינג','היאבקות','ג׳יו ג׳יטסו','ריצה','אירובי','שחייה','קונדישנינג','גמישות']:['Strength','Muay Thai','Boxing','Sparring','Wrestling','Jiu-jitsu','Running','Cardio','Swimming','Conditioning','Mobility'];
const INTS=[['light','Light'],['moderate','Moderate'],['hard','Hard'],['very hard','Very hard']],intL=v=>(INTS.find(o=>o[0]==v)||[0,v])[1];
function trForm(pre){return`<datalist id="${pre}_types">${TTYPES().map(o=>`<option value="${o}">`).join('')}</datalist><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="${pre}_ty" list="${pre}_types" placeholder="Training type" style="width:150px"><select id="${pre}_int">${INTS.map(o=>`<option value="${o[0]}" ${o[0]=='moderate'?'selected':''}>${o[1]}</option>`).join('')}</select><input id="${pre}_t" type="time"><select id="${pre}_d">${[30,45,60,75,90,120,150,180].map(m=>`<option value="${m}" ${m==60?'selected':''}>${m} min</option>`).join('')}</select><input id="${pre}_sw" type="number" step="0.1" min="0" max="3" placeholder="Sweat loss, kg per hour (optional)" style="width:130px"></div>`}
const trRow=(s,del)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)"><span><b>${s.ty||'Training'}</b> · <span>${intL(s.int)}</span>${s.t?' · '+s.t:''} · <span>${s.d} min</span></span><button class="b sm" onclick="${del}">Remove</button></div>`;
function review(){const r=rvS(),W=rvWeights(),days=rvDays(),loc=S.lang=='he'?'he-IL':'en-GB';
let h=`<div class="card"><h2>Weekly review</h2><div class="mut" style="line-height:1.5">Choose the weigh-in date. For each of the 7 days before it, write the weight if you have it, the training, the water, and every meal in words. No need to weigh the food: amounts are estimated from the words, and you can correct any amount.</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px"><div><div class="mut">Weigh-in date</div><input type="date" value="${r.we}" onchange="rvSet('we',this.value)"></div><div><div class="mut">Age</div><input type="number" min="10" max="60" value="${r.age}" onchange="rvSet('age',this.value)" style="width:70px"></div><div><div class="mut">Body weight, if not entered each day (kg)</div><input type="number" step="0.1" value="${r.kg}" onchange="rvSet('kg',this.value)" style="width:90px"></div></div></div>`;
days.forEach(x=>{const dd=rvDD(x.iso),res=RVR&&RVR[x.iso];
h+=`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><h2 style="margin:0">${x.dt.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'numeric'})}</h2><span class="mut">${x.k==0?'Weigh-in day':x.k==1?'1 day before weigh-in':x.k+' days before weigh-in'}</span></div>

<div style="margin-top:10px"><b>Training</b><div class="mut">Rest day: leave it empty.</div>${(dd.tr||[]).map((s,k)=>trRow(s,`rvDelTr('${x.iso}',${k})`)).join('')}${trForm('rt_'+x.iso)}<button class="b sm" style="margin-top:6px" onclick="rvAddTr('${x.iso}')">Add session</button></div>
<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><b>Water drunk</b><input type="number" step="any" min="0" value="${dd.wv||''}" oninput="rvIn('${x.iso}','wv',this.value)" style="width:90px"><select onchange="rvIn('${x.iso}','wu',this.value)"><option value="l" ${dd.wu=='l'||!dd.wu?'selected':''}>Liters</option><option value="ml" ${dd.wu=='ml'?'selected':''}>ml</option><option value="cups" ${dd.wu=='cups'?'selected':''}>Cups</option></select></div>
<div style="margin-top:10px"><b>Meals</b></div>${RVM.map(m=>`<div class="mut" style="margin-top:8px">${m[1]}</div><textarea placeholder="Write what was eaten, with any measures, for example: a bowl and a half of oat porridge with 2 teaspoons of cocoa" oninput="rvIn('${x.iso}','${m[0]}',this.value)" style="width:100%;min-height:44px">${(dd[m[0]]||'').replace(/</g,'&lt;')}</textarea>${res&&res[m[0]].length?`<div style="margin-top:4px">${res[m[0]].map((o,i)=>o.miss?`<div style="color:var(--r)">Not found: ${o.part}. Rewrite it with a simpler name.</div>`:`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><div style="flex:1">${o.x.name}${o.desc?' <span class="mut">('+o.desc+')</span>':''}${o.assumed?' <span style="color:var(--r)">Fat % not written: '+o.assumed+'% used. Write the % for accuracy.</span>':''}${o.warn?'<div class="mut" style="color:var(--r)">'+o.warn+'</div>':''}<div class="mut">carbs ${((o.x.per.c||0)*o.g/100).toFixed(1)} g · fat ${((o.x.per.f||0)*o.g/100).toFixed(1)} g · fiber ${((o.x.per.fib||0)*o.g/100).toFixed(1)} g · sodium ${Math.round((o.x.per.na||0)*o.g/100)} mg</div>${o.srv?'<div class="mut">Found online: '+o.srv+'. Please check it.</div>':''}</div><input type="number" value="${Math.round(o.g)}" onchange="rvG('${x.iso}','${m[0]}',${i},this.value)" style="width:80px"><span class="mut">g</span><button class="b sm" onclick="rvDel('${x.iso}','${m[0]}',${i})">Remove</button></div>`).join('')}</div>`:''}`).join('')}`;
if(res)h+=rvDayHtml(x,W[x.iso],res,dd);
h+=`</div>`});
h+=`<div style="display:flex;gap:8px;margin:12px 0"><button class="b p" onclick="rvCalc()">Calculate the week</button></div>`;
